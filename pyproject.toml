[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle-design-agent"
version = "0.1.0"
description = "AI-assisted black-and-white sublimation bottle artwork pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "CairoSVG>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
providers = ["anthropic>=0.40", "openai>=1.40"]
assets = ["psd-tools>=1.9", "numpy>=1.26"]

[project.scripts]
bottle-agent = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "agents*", "designs*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
